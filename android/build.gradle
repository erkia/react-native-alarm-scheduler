buildscript {
  repositories { google(); mavenCentral() }
  dependencies {
    classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:${rootProject.ext.has('kotlinVersion') ? rootProject.ext.kotlinVersion : '2.0.21'}"
  }
}

apply plugin: 'com.android.library'
apply plugin: 'org.jetbrains.kotlin.android'
apply plugin: 'com.facebook.react'

group = 'expo.modules.alarm'

def sdkVersion = { name, fallback -> rootProject.ext.has(name) ? rootProject.ext.get(name) : fallback }

android {
  namespace 'expo.modules.alarm'
  compileSdkVersion sdkVersion('compileSdkVersion', 35)
  defaultConfig {
    minSdkVersion sdkVersion('minSdkVersion', 24)
    targetSdkVersion sdkVersion('targetSdkVersion', 35)
  }
}

react {
  jsRootDir = file('../src/specs')
  libraryName = 'AlarmSchedulerSpec'
  codegenJavaPackageName = 'expo.modules.alarm'
}

dependencies {
  implementation 'com.facebook.react:react-android'
  testImplementation 'junit:junit:4.13.2'
}
